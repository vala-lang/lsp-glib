name: Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 20

    steps:
      - name: Install dependencies
        run: >-
          dnf install -y
          gcc
          git
          gjs
          glib2-devel
          gobject-introspection-devel
          jsonrpc-glib-devel
          meson
          ninja-build
          python3
          python3-gobject
          vala

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure build
        run: >-
          meson setup build
          --buildtype=debug
          -Denable_valadoc=false
          -Dgi-docgen=false

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs
